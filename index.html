<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>Mampf-Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: ruhige Küchen-App. Kopf mit Woche + Personen, Wochenübersicht (5 Teller), Umschalter Montag/Mittwoch,
   darunter entweder der Karten-Stapel zum Wischen oder (fertig) Gerichte links + Einkaufsliste nach Regalen rechts. */
:root {
  --bg: #f6f5f1;
  --surface: #ffffff;
  --surface-2: #efede7;
  --ink: #1d2320;
  --muted: #646b66;
  --line: #e2dfd7;
  --accent: #2f7a4d;
  --accent-ink: #ffffff;
  --accent-soft: #e2efe6;
  --no: #b5482f;
  --no-soft: #f6e4de;
  --shadow: 0 1px 2px rgba(29, 35, 32, .06), 0 8px 24px rgba(29, 35, 32, .08);
  --font-display: "Young Serif", Georgia, "Times New Roman", serif;
  --font-ui: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --radius: 18px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #151816; --surface: #1e2320; --surface-2: #272d29; --ink: #ecefe9; --muted: #a2aaa4; --line: #323a35;
  --accent: #6cc191; --accent-ink: #0f1a13; --accent-soft: #23362a; --no: #e98b72; --no-soft: #3a2621;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 28px rgba(0,0,0,.35); color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #151816; --surface: #1e2320; --surface-2: #272d29; --ink: #ecefe9; --muted: #a2aaa4; --line: #323a35;
  --accent: #6cc191; --accent-ink: #0f1a13; --accent-soft: #23362a; --no: #e98b72; --no-soft: #3a2621;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 28px rgba(0,0,0,.35); color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
.wrap { max-width: 1080px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 72px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 400; letter-spacing: -0.01em; text-wrap: balance; margin: 0; }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

/* ---------- Kopf ---------- */
header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px; margin-bottom: 24px; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; color: var(--accent); margin-bottom: 6px; }
.brand svg { width: 22px; height: 22px; }
h1 { font-size: clamp(30px, 5vw, 42px); line-height: 1.1; }
.dates { color: var(--muted); margin: 4px 0 0; }
.persons { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 8px 6px 16px; }
.persons span { color: var(--muted); font-size: 15px; }
.persons b { font-variant-numeric: tabular-nums; min-width: 1.4em; text-align: center; font-size: 18px; }
.persons button { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface-2); cursor: pointer; font-size: 18px; line-height: 1; }
.persons button:hover { border-color: var(--muted); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- Wochenübersicht ---------- */
.week { margin-bottom: 28px; }
.week-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 10px; flex-wrap: wrap; }
.week-head h2 { font-size: 22px; }
.week-head p { margin: 0; color: var(--muted); font-size: 14px; }
.slots { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 720px) { .slots { grid-template-columns: repeat(5, minmax(120px, 1fr)); overflow-x: auto; padding-bottom: 6px; scroll-snap-type: x mandatory; } .slot { scroll-snap-align: start; } }
.slot { background: var(--surface); border-radius: 14px; overflow: hidden; border: 1px solid var(--line); text-align: left; padding: 0; min-width: 0; display: flex; flex-direction: column; }
button.slot { cursor: pointer; }
button.slot:hover { box-shadow: var(--shadow); }
.slot .art { aspect-ratio: 5 / 3; background: var(--surface-2); display: block; }
.slot .art svg { width: 100%; height: 100%; display: block; }
.slot .info { padding: 8px 10px 10px; display: grid; gap: 2px; }
.slot .tag { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.slot .nm { font-size: 14px; font-weight: 600; line-height: 1.25; hyphens: auto; }
.slot.empty { border-style: dashed; background: transparent; }
.slot.empty .art { display: grid; place-items: center; background: transparent; color: var(--muted); font-size: 13px; }
.slot.empty .nm { color: var(--muted); font-weight: 500; }
@media (max-width: 720px) { .slot.empty .art { aspect-ratio: auto; height: 40px; } }

/* ---------- Umschalter ---------- */
.seg { display: inline-grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); background: var(--surface-2); border-radius: 14px; padding: 4px; gap: 4px; width: 100%; max-width: 560px; margin-bottom: 22px; }
.seg button { border: 0; background: transparent; padding: 10px 12px; border-radius: 10px; cursor: pointer; text-align: left; min-width: 0; }
.seg button[aria-selected="true"] { background: var(--surface); box-shadow: var(--shadow); }
.seg .t1 { display: block; font-weight: 700; font-size: 15px; }
.seg .t2 { display: block; font-size: 13px; color: var(--muted); }
.seg .t2.ok { color: var(--accent); font-weight: 600; }

/* ---------- Wischen ---------- */
.swipe { display: grid; justify-items: center; }
.progress { width: 100%; max-width: 420px; margin-bottom: 14px; }
.progress .row { display: flex; justify-content: space-between; font-size: 14px; color: var(--muted); margin-bottom: 6px; }
.progress .row b { color: var(--ink); }
.bars { display: grid; grid-auto-flow: column; gap: 6px; }
.bars i { height: 6px; border-radius: 3px; background: var(--line); }
.bars i.on { background: var(--accent); }
.stage { position: relative; width: 100%; max-width: 420px; height: 560px; }
.rcard { position: absolute; inset: 0; background: var(--surface); border-radius: 22px; box-shadow: var(--shadow); overflow: hidden; display: flex; flex-direction: column; touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab; transform-origin: 50% 85%; border: 1px solid var(--line); }
.rcard.back1 { transform: translateY(10px) scale(.965); opacity: .9; }
.rcard.back2 { transform: translateY(20px) scale(.93); opacity: .7; }
.rcard.back1, .rcard.back2 { pointer-events: none; }
.rcard .art { aspect-ratio: 16 / 9; flex: none; background: var(--surface-2); }
.rcard .art svg { width: 100%; height: 100%; display: block; }
.rcard .body { padding: 16px 20px 18px; display: flex; flex-direction: column; gap: 8px; flex: 1; min-height: 0; }
.rcard h3 { font-size: 24px; line-height: 1.15; flex: none; }
.rcard p { margin: 0; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; flex: none; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: var(--surface-2); color: var(--ink); }
.pill svg { width: 14px; height: 14px; }
.pill.ai { background: var(--accent-soft); color: var(--accent); }
.rcard .foot { margin-top: auto; display: flex; justify-content: space-between; align-items: center; }
.link { border: 0; background: none; padding: 0; color: var(--accent); font-weight: 700; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.ings { font-size: 13px; color: var(--muted); overflow: hidden; flex: 0 1 auto; min-height: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.stamp { position: absolute; top: 18px; font-weight: 800; font-size: 22px; letter-spacing: .06em; padding: 4px 14px; border-radius: 10px; opacity: 0; pointer-events: none; z-index: 2; }
.stamp.yes { left: 18px; background: var(--accent); color: var(--accent-ink); transform: rotate(-8deg); }
.stamp.no { right: 18px; background: var(--no); color: #fff; transform: rotate(8deg); }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; max-width: 420px; margin-top: 18px; }
.act { display: flex; align-items: center; justify-content: center; gap: 8px; height: 56px; border-radius: 16px; font-weight: 700; font-size: 17px; cursor: pointer; border: 1.5px solid var(--line); background: var(--surface); }
.act svg { width: 22px; height: 22px; }
.act.no { color: var(--no); }
.act.no:hover { background: var(--no-soft); border-color: var(--no); }
.act.yes { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.act.yes:hover { filter: brightness(1.05); }
@media (prefers-reduced-motion: no-preference) { .act { transition: transform .12s; } .act:active { transform: scale(.97); } }
.hint { color: var(--muted); font-size: 14px; text-align: center; margin: 12px 0 0; max-width: 420px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; }
.empty-deck { max-width: 420px; text-align: center; }
.empty-deck h3 { font-size: 22px; margin-bottom: 6px; }
.empty-deck p { color: var(--muted); margin: 0 0 14px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 12px; font-weight: 700; cursor: pointer; border: 1.5px solid var(--line); background: var(--surface); text-decoration: none; color: var(--ink); font-size: 15px; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn[disabled] { opacity: .6; cursor: wait; }
.btn svg { width: 18px; height: 18px; }
.ai-row { margin-top: 18px; text-align: center; max-width: 420px; }
.ai-row .q { color: var(--muted); font-size: 14px; margin-bottom: 6px; }
.ai-status { color: var(--muted); font-size: 14px; margin-top: 8px; min-height: 1.4em; }
.locked { max-width: 520px; }
.locked h3 { font-size: 22px; margin-bottom: 6px; }
.locked p { margin: 0; color: var(--muted); }

/* ---------- Fertig ---------- */
.done { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 24px; align-items: start; }
@media (max-width: 860px) { .done { grid-template-columns: minmax(0, 1fr); } }
.done h2 { font-size: 24px; margin-bottom: 4px; }
.done .lead { color: var(--muted); margin: 0 0 14px; }
.picks { display: grid; gap: 12px; }
.pick { display: grid; grid-template-columns: 120px minmax(0, 1fr); background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.pick .art { background: var(--surface-2); }
.pick .art svg { width: 100%; height: 100%; display: block; }
.pick .txt { padding: 12px 14px; display: grid; gap: 4px; align-content: center; min-width: 0; }
.pick h3 { font-size: 18px; line-height: 1.2; }
.pick .row { display: flex; gap: 14px; flex-wrap: wrap; font-size: 14px; }
.pick .row .link.quiet { color: var(--muted); font-weight: 600; }

.shop-card h2 { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.count { font-family: var(--font-ui); font-size: 14px; color: var(--muted); font-weight: 600; }
.meter { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; margin: 10px 0 16px; }
.meter i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.how { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; background: var(--accent-soft); border-radius: 12px; padding: 12px 14px; font-size: 14px; margin-bottom: 14px; }
.how b { grid-column: 1 / -1; }
.how span.n { font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; }
.tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
.copied { color: var(--accent); font-size: 14px; font-weight: 600; }
.group { margin-top: 18px; }
.group h4 { margin: 0 0 4px; font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.group h4 svg { width: 16px; height: 16px; }
ul.items { list-style: none; margin: 0; padding: 0; }
ul.items li { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto auto; gap: 4px 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
ul.items li:last-child { border-bottom: 0; }
ul.items input { width: 20px; height: 20px; accent-color: var(--accent); margin: 0; cursor: pointer; }
.iname { font-weight: 600; min-width: 0; }
.iname small { display: block; font-weight: 400; color: var(--muted); font-size: 13px; line-height: 1.3; }
.qty { font-variant-numeric: tabular-nums; color: var(--muted); text-align: right; white-space: nowrap; font-size: 15px; }
.gk { font-size: 13px; font-weight: 700; color: var(--accent); text-decoration: none; padding: 6px 10px; border-radius: 8px; border: 1.5px solid var(--accent-soft); white-space: nowrap; }
.gk:hover { background: var(--accent-soft); }
li.got .iname, li.got .qty { color: var(--muted); text-decoration: line-through; }
li.got .gk { opacity: .5; }
details.basics { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 12px; }
details.basics summary { cursor: pointer; font-weight: 600; color: var(--muted); }
.save-note { font-size: 13px; color: var(--muted); margin: 16px 0 0; }

.art img { width: 100%; height: 100%; object-fit: cover; display: block; -webkit-user-drag: none; }
.art.noimg { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; background: radial-gradient(circle at 50% 42%, var(--surface) 0 30%, var(--accent-soft) 31%); }
.art.noimg .em { font-size: 72px; line-height: 1; }
.art.noimg .cap { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .02em; background: var(--surface); padding: 2px 10px; border-radius: 999px; }
.pick .art.noimg .em, .slot .art.noimg .em { font-size: 36px; }
.pick .art.noimg .cap, .slot .art.noimg .cap { display: none; }
.credit { margin-top: 40px; font-size: 13px; color: var(--muted); text-align: center; }
.credit a { color: inherit; }
.quick { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: var(--muted); margin: -4px 0 14px; cursor: pointer; }
.quick input { width: 18px; height: 18px; accent-color: var(--accent); margin: 0; }
.rcard .by { font-size: 13px; font-weight: 700; color: var(--accent); margin-top: -4px; }
.sheet .source { font-size: 14px; color: var(--muted); margin: 8px 0 0; }
.sheet .source a { color: var(--accent); font-weight: 600; }
/* ---------- Rezept ---------- */
dialog { border: 0; padding: 0; background: transparent; width: min(760px, calc(100vw - 24px)); max-height: calc(100dvh - 24px); color: var(--ink); }
dialog::backdrop { background: rgba(20, 24, 22, .45); }
.sheet { background: var(--surface); border-radius: 22px; overflow-y: auto; max-height: calc(100dvh - 24px); position: relative; }
.sheet .art { aspect-ratio: 5 / 2; background: var(--surface-2); }
.sheet .art svg { width: 100%; height: 100%; display: block; }
.sheet .content { padding: 20px 22px 24px; }
.sheet h2 { font-size: 28px; line-height: 1.15; margin: 6px 0 8px; }
.sheet .desc { color: var(--muted); margin: 10px 0 0; }
.cols { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); gap: 28px; margin-top: 20px; }
@media (max-width: 640px) { .cols { grid-template-columns: minmax(0, 1fr); gap: 18px; } }
.cols h4 { margin: 0 0 8px; font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
table.ing { width: 100%; border-collapse: collapse; font-size: 15px; }
table.ing td { padding: 6px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
table.ing td.q { text-align: right; color: var(--muted); white-space: nowrap; padding-left: 12px; font-variant-numeric: tabular-nums; }
ol.steps { margin: 0; padding: 0; list-style: none; counter-reset: s; display: grid; gap: 12px; }
ol.steps li { counter-increment: s; display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; }
ol.steps li::before { content: counter(s); width: 26px; height: 26px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-weight: 800; font-size: 13px; display: grid; place-items: center; }
.close { position: absolute; top: 12px; right: 12px; width: 38px; height: 38px; border-radius: 50%; border: 0; background: rgba(255,255,255,.92); color: #1d2320; cursor: pointer; display: grid; place-items: center; box-shadow: 0 2px 8px rgba(0,0,0,.15); z-index: 1; }
.close svg { width: 18px; height: 18px; }
.sheet-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 22px; }
</style>

<div class="wrap" lang="de">
  <header>
    <div>
      <div class="brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/></svg>Mampf-Plan</div>
      <h1 id="weekTitle">Diese Woche</h1>
      <p class="dates" id="dates"></p>
    </div>
    <div class="persons" role="group" aria-label="Anzahl Personen">
      <span>Personen</span>
      <button type="button" id="pMinus" aria-label="Eine Person weniger">−</button>
      <b id="pCount">4</b>
      <button type="button" id="pPlus" aria-label="Eine Person mehr">+</button>
    </div>
  </header>

  <section class="week" aria-labelledby="weekHead">
    <div class="week-head"><h2 id="weekHead">Was es diese Woche gibt</h2><p>Montag 3 Gerichte · Mittwoch 2 Gerichte</p></div>
    <div class="slots" id="slots"></div>
  </section>

  <div class="seg" role="tablist" id="tabs" aria-label="Einkaufsrunde"></div>
  <main id="round"></main>
  <p class="credit">Fotos und Rezeptideen: <a href="https://www.themealdb.com" target="_blank" rel="noopener">TheMealDB</a>, BBC Good Food und <a href="https://www.jamieoliver.com" target="_blank" rel="noopener">Jamie Oliver</a>. Alle Rezepte für 4 Personen auf Deutsch übersetzt und angepasst.</p>
</div>

<dialog id="recipeDlg" aria-labelledby="dlgTitle"><div class="sheet" id="sheet"></div></dialog>

<script>
// ================= Rezepte (Mengen für 4 Personen) =================
const BASICS = new Set(["Salz", "Pfeffer", "Olivenöl", "Sonnenblumenöl", "Zucker", "Gemüsebrühe", "Rindsuppe", "Hühnersuppe", "Oregano", "Currypulver", "Paprikapulver", "Majoran", "Muskatnuss", "Kreuzkümmel", "Zimt", "Lorbeerblätter", "Pfefferkörner", "Essig", "Senf", "Ketchup", "Sojasauce", "Mehl", "Honig"]);
const R = (id, mealId, name, desc, time, tags, ing, steps) => ({ id, photo: "img/" + mealId + ".jpg", name, desc, time, tags, ing: ing.map(s => { const [n, q, u] = s.split("|"); return [n, Number(q || 0), u || ""]; }), steps });
const RECIPES = [
  R("tafelspitz", 53447, "Tafelspitz mit Erdäpfeln und Apfelkren", "Zart gekochtes Rindfleisch in kräftiger Suppe. Der Wiener Sonntagsklassiker, die Suppe gibt's als Vorspeise dazu.", 180, ["Österreich", "Rind"],
    ["Tafelspitz (Rind)|1200|g", "Suppengrün|1|Bund", "Zwiebel|1|Stk", "Erdäpfel speckig|800|g", "Apfelmus|200|g", "Kren (Meerrettich)|1|Glas", "Schnittlauch|1|Bund", "Lorbeerblätter|2|Stk", "Pfefferkörner|1|TL", "Butter|30|g", "Salz"],
    ["Zwiebel ungeschält halbieren und die Schnittflächen ohne Fett in einem Topf dunkelbraun rösten.", "3 Liter Wasser mit Suppengrün, Zwiebel, Lorbeer und Pfefferkörnern aufkochen. Das gewaschene Fleisch einlegen.", "Bei kleiner Hitze 2½ bis 3 Stunden leise köcheln lassen, bis das Fleisch weich ist. Schaum abschöpfen. Erst nach 2 Stunden salzen.", "Erdäpfel kochen, schälen, in Scheiben schneiden und in Butter goldbraun braten.", "Apfelmus mit 2 EL Kren verrühren.", "Fleisch quer zur Faser in Scheiben schneiden. Mit etwas Suppe, Erdäpfeln, Apfelkren und Schnittlauch servieren."]),
  R("kaspressknoedel", 53445, "Kaspressknödel in klarer Suppe", "Knusprig gebratene Käseknödel aus Tirol. In heißer Suppe oder mit grünem Salat ein echtes Wohlfühlessen.", 45, ["Österreich", "Vegetarisch"],
    ["Knödelbrot (Semmelwürfel)|250|g", "Bergkäse|250|g", "Eier|2|Stk", "Milch|250|ml", "Erdäpfel mehlig|300|g", "Zwiebel|1|Stk", "Petersilie|1|Bund", "Mehl|100|g", "Butter|60|g", "Gemüsebrühe|1200|ml", "Salz"],
    ["Knödelbrot mit der Milch übergießen, salzen und 10 Minuten ziehen lassen.", "Erdäpfel schälen und fein reiben, Käse reiben. Beides mit den Eiern und gehackter Petersilie zum Brot geben.", "Zwiebel fein würfeln, in etwas Butter goldbraun rösten und untermischen. Mehl dazugeben und alles kurz verkneten.", "Mit nassen Händen 8 Knödel formen und flach drücken. In Butter auf beiden Seiten je 4 Minuten goldbraun braten.", "Brühe erhitzen und die Knödel darin servieren, mit Schnittlauch oder Petersilie bestreut."]),
  R("tirolerknoedel", 53444, "Tiroler Speckknödel in Suppe", "Flaumige Brotknödel mit Speck und Petersilie, serviert in heißer Suppe. Ein Klassiker aus den Bergen.", 60, ["Österreich", "Schwein"],
    ["Knödelbrot (Semmelwürfel)|250|g", "Milch|250|ml", "Speck|120|g", "Eier|3|Stk", "Zwiebel|1|Stk", "Petersilie|1|Bund", "Mehl|2|EL", "Butter|20|g", "Rindsuppe|1200|ml", "Schnittlauch|1|Bund", "Salz", "Pfeffer", "Muskatnuss"],
    ["Zwiebel fein hacken, Speck klein würfeln. Beides in Butter glasig anschwitzen, Petersilie kurz mitrösten.", "Knödelbrot in eine Schüssel geben. Milch mit Eiern, Salz, Pfeffer und Muskat verquirlen und darübergießen.", "Speckmischung und Mehl untermengen und zu einer eher festen Masse verkneten. 30 Minuten rasten lassen.", "Mit nassen Händen 8 Knödel formen. In leicht siedendem Salzwasser 15 Minuten ziehen lassen, nicht sprudelnd kochen.", "Suppe erhitzen, Knödel hineinlegen und mit Schnittlauch servieren."]),
  R("griessnockerlsuppe", 53446, "Grießnockerlsuppe", "Klare Rindsuppe mit flaumigen Grießnockerln. Leicht, mild und bei Kindern immer beliebt.", 40, ["Österreich", "Suppe"],
    ["Weizengrieß|120|g", "Butter|60|g", "Eier|1|Stk", "Rindsuppe|1500|ml", "Karotten|2|Stk", "Schnittlauch|1|Bund", "Salz", "Muskatnuss"],
    ["Weiche Butter schaumig rühren, mit Salz und einer Prise Muskat würzen.", "Ei kräftig einrühren, dann den Grieß dazugeben und glatt rühren. Zugedeckt 20 Minuten rasten lassen.", "Mit zwei nassen Esslöffeln Nockerl formen.", "In leicht siedendes Salzwasser legen und 15 Minuten ziehen lassen, nicht kochen. Danach 5 Minuten im Wasser nachziehen lassen.", "Suppe mit Karottenscheiben erhitzen, Nockerl hineingeben und mit Schnittlauch servieren."]),
  R("schnitzel", 53135, "Knuspriges Schnitzel mit Erdäpfelsalat", "Goldbraun paniert, mit Zitrone und einem flaumigen Erdäpfelsalat. Österreich auf dem Teller.", 60, ["Österreich", "Schwein"],
    ["Schnitzelfleisch (Schwein)|600|g", "Eier|2|Stk", "Semmelbrösel|150|g", "Mehl|80|g", "Erdäpfel speckig|1000|g", "Rote Zwiebel|1|Stk", "Zitrone|1|Stk", "Sonnenblumenöl|200|ml", "Rindsuppe|200|ml", "Essig|3|EL", "Senf|1|TL", "Salz", "Pfeffer"],
    ["Erdäpfel in der Schale 25 Minuten kochen, schälen und noch warm in dünne Scheiben schneiden.", "Zwiebel fein hacken. Warme Suppe mit Essig, Senf, 3 EL Öl, Salz und Pfeffer verrühren und mit der Zwiebel über die Erdäpfel gießen. 20 Minuten ziehen lassen.", "Schnitzel dünn klopfen und salzen. Erst in Mehl, dann in verquirltem Ei, dann in Bröseln wenden.", "In reichlich heißem Öl pro Seite etwa 3 Minuten goldbraun backen und auf Küchenpapier abtropfen lassen.", "Mit Zitronenspalten und Erdäpfelsalat servieren."]),
  R("gulasch", 53057, "Rindsgulasch mit Nockerln", "Lange geschmort, mit viel Zwiebel und mildem Paprika. Dazu Nockerl oder Brot zum Tunken.", 150, ["Österreich", "Rind"],
    ["Rindfleisch (Wadschinken)|800|g", "Zwiebel|4|Stk", "Karotten|2|Stk", "Knoblauch|2|Zehe", "Tomatenmark|2|EL", "Paprikapulver|2|EL", "Rindsuppe|1000|ml", "Nockerl (Kühlregal)|500|g", "Senf|2|EL", "Lorbeerblätter|2|Stk", "Sonnenblumenöl|3|EL", "Salz", "Pfeffer"],
    ["Fleisch in 3 cm große Würfel schneiden, mit Senf, Salz und Pfeffer einreiben.", "Fleisch in heißem Öl rundum anbraten und herausnehmen.", "Zwiebeln fein schneiden, Karotten reiben. Beides im selben Topf bei kleiner Hitze 15 Minuten weich rösten.", "Tomatenmark und Paprikapulver kurz einrühren, sofort mit Suppe aufgießen. Fleisch, Knoblauch und Lorbeer dazugeben.", "Zugedeckt bei kleiner Hitze 1½ bis 2 Stunden schmoren, bis das Fleisch zart ist. Bei Bedarf Wasser nachgießen.", "Nockerl nach Packung erwärmen und mit dem Gulasch servieren."]),
  R("laibchen", 53553, "Fleischlaibchen mit Erdäpfelpüree", "Saftige faschierte Laibchen, außen knusprig. Dazu cremiges Püree und Gurkensalat.", 50, ["Klassiker", "Schwein"],
    ["Gemischtes Faschiertes|600|g", "Zwiebel|1|Stk", "Knoblauch|1|Zehe", "Haferflocken|2|EL", "Eier|1|Stk", "Milch|350|ml", "Butter|60|g", "Erdäpfel mehlig|1000|g", "Gurke|1|Stk", "Sauerrahm|125|g", "Mehl|1|EL", "Salz", "Pfeffer", "Muskatnuss"],
    ["Zwiebel und Knoblauch fein hacken. Faschiertes mit Salz, Pfeffer, Mehl, Haferflocken, Zwiebel, Knoblauch, Ei und 100 ml Milch gut verkneten. 30 Minuten kalt stellen.", "Erdäpfel schälen und in Salzwasser 20 Minuten weich kochen.", "Aus der Masse etwa 12 Laibchen formen und in Butter pro Seite 5 Minuten braten, bis sie durch sind.", "Erdäpfel abgießen und mit der restlichen warmen Milch und Butter zu Püree stampfen. Mit Salz und Muskat würzen.", "Gurke hobeln und mit Sauerrahm, Salz und Pfeffer anmachen."]),
  R("palatschinken", 53022, "Palatschinken mit Marmelade", "Dünne Pfannkuchen, gefüllt mit Marillenmarmelade oder Nutella. Das süße Abendessen, auf das sich alle freuen.", 30, ["Süß", "Vegetarisch"],
    ["Mehl|250|g", "Eier|4|Stk", "Milch|500|ml", "Mineralwasser|150|ml", "Marillenmarmelade|1|Glas", "Butter|40|g", "Staubzucker|2|EL", "Zucker|1|TL", "Salz"],
    ["Mehl, Eier, Milch, Mineralwasser, Zucker und eine Prise Salz zu einem glatten, dünnen Teig verrühren. 10 Minuten rasten lassen.", "Eine beschichtete Pfanne mit wenig Butter auspinseln und erhitzen.", "Einen kleinen Schöpfer Teig hineingießen und durch Schwenken verteilen. Wenden, sobald die Oberseite nicht mehr flüssig ist.", "So den ganzen Teig verbacken, die fertigen Palatschinken warm halten.", "Mit Marmelade bestreichen, einrollen und mit Staubzucker bestreuen."]),
  R("bolognese", 52770, "Spaghetti Bolognese", "Der Klassiker mit Faschiertem, Champignons und Paradeisern. Lange geköchelt schmeckt die Sauce am besten.", 45, ["Pasta", "Rind"],
    ["Spaghetti|500|g", "Rinderfaschiertes|500|g", "Zwiebel|2|Stk", "Knoblauch|1|Zehe", "Champignons|100|g", "Gehackte Paradeiser (Dose)|1|Dose", "Tomatenmark|1|EL", "Rindsuppe|300|ml", "Parmesan|60|g", "Olivenöl|1|EL", "Oregano|1|TL", "Salz", "Pfeffer"],
    ["Zwiebeln fein hacken und in Öl bei hoher Hitze 3 bis 4 Minuten anbraten.", "Knoblauch und Faschiertes dazugeben und krümelig braun anbraten.", "Champignons klein schneiden und mit Oregano 2 Minuten mitbraten.", "Paradeiser, Tomatenmark und Suppe einrühren, salzen und pfeffern. Zugedeckt 30 Minuten köcheln lassen.", "Spaghetti in Salzwasser nach Packung kochen, abgießen und mit der Sauce und geriebenem Parmesan servieren."]),
  R("lasagne", 52844, "Lasagne mit Fleischsauce", "Saftige Schichten aus Fleischsauce, Nudelplatten und Käse. Lässt sich gut am Vortag vorbereiten.", 90, ["Pasta", "Rind"],
    ["Lasagneblätter|250|g", "Rinderfaschiertes|500|g", "Frühstücksspeck|2|Scheiben", "Zwiebel|1|Stk", "Karotten|1|Stk", "Stangensellerie|1|Stk", "Knoblauch|2|Zehe", "Tomatenmark|1|EL", "Gehackte Paradeiser (Dose)|2|Dose", "Crème fraîche|400|ml", "Mozzarella|1|Stk", "Parmesan|50|g", "Honig|1|EL", "Olivenöl|1|EL", "Salz", "Pfeffer"],
    ["Speck klein schneiden und in Öl goldbraun anbraten. Zwiebel, Sellerie und Karotte fein würfeln und 5 Minuten mitbraten.", "Knoblauch und Faschiertes dazugeben und 6 Minuten braun anbraten. Tomatenmark kurz mitrösten.", "Paradeiser, eine halbe Dose Wasser und Honig dazugeben, salzen und 20 Minuten köcheln lassen.", "Ofen auf 200 °C (180 °C Umluft) vorheizen. In einer Auflaufform abwechselnd Sauce und Lasagneblätter schichten.", "Crème fraîche darüber verstreichen, Mozzarella zerzupfen und mit Parmesan darauf verteilen.", "25 bis 30 Minuten goldbraun backen und vor dem Schneiden 10 Minuten rasten lassen."]),
  R("carbonara", 52982, "Spaghetti Carbonara", "Cremig nur mit Ei, Käse und knusprigem Speck. In 20 Minuten auf dem Tisch.", 20, ["Pasta", "Schnell"],
    ["Spaghetti|400|g", "Speck (Pancetta)|150|g", "Eier|4|Stk", "Parmesan|60|g", "Pecorino|40|g", "Knoblauch|1|Zehe", "Butter|20|g", "Salz", "Pfeffer"],
    ["Spaghetti in reichlich Salzwasser bissfest kochen.", "Eier mit dem fein geriebenen Käse und viel Pfeffer verquirlen.", "Speck klein würfeln und mit der angedrückten Knoblauchzehe in Butter knusprig braten. Knoblauch wieder herausnehmen.", "Spaghetti tropfnass zum Speck geben und die Pfanne vom Herd nehmen.", "Eiermischung und einen Schuss Nudelwasser unterrühren, bis eine cremige Sauce entsteht. Sofort servieren."]),
  R("cannelloni", 52849, "Cannelloni mit Spinat und Ricotta", "Nudelrollen mit cremiger Spinat-Ricotta-Füllung, überbacken in Paradeissauce.", 70, ["Pasta", "Vegetarisch"],
    ["Cannelloni|250|g", "Blattspinat (TK)|600|g", "Ricotta|500|g", "Parmesan|100|g", "Mozzarella|1|Stk", "Gehackte Paradeiser (Dose)|2|Dose", "Mascarpone|250|g", "Milch|3|EL", "Knoblauch|3|Zehe", "Basilikum|1|Topf", "Olivenöl|2|EL", "Zucker|1|EL", "Essig|1|EL", "Salz", "Pfeffer", "Muskatnuss"],
    ["Knoblauch hacken und in Öl 1 Minute anbraten. Paradeiser, Zucker und Essig dazu, salzen und 20 Minuten dick einköcheln. Basilikum unterrühren und in eine Auflaufform füllen.", "Spinat auftauen, gut ausdrücken und hacken. Mit Ricotta und der Hälfte vom Parmesan mischen, mit Salz, Pfeffer und Muskat würzen.", "Ofen auf 200 °C (180 °C Umluft) vorheizen. Füllung mit einem Spritzbeutel in die Cannelloni füllen und auf die Sauce legen.", "Mascarpone mit Milch glatt rühren und darüber verteilen. Mit Mozzarella und restlichem Parmesan belegen.", "30 bis 35 Minuten goldbraun backen."]),
  R("alfredo", 52835, "Fettuccine Alfredo", "Bandnudeln in einer seidigen Sauce aus Obers, Butter und Parmesan. Schnell, mild und sehr beliebt bei Kindern.", 20, ["Pasta", "Vegetarisch", "Schnell"],
    ["Fettuccine|400|g", "Schlagobers|300|ml", "Butter|40|g", "Parmesan|120|g", "Maisstärke|1|TL", "Petersilie|1|Bund", "Salz", "Pfeffer", "Muskatnuss"],
    ["Obers, Butter und Maisstärke in einem Topf unter Rühren leicht aufkochen, dann warm halten.", "Parmesan fein reiben und mit etwas Muskat und Pfeffer mischen.", "Fettuccine in Salzwasser nach Packung kochen. Eine Tasse Nudelwasser aufheben.", "Nudeln in die Obersauce geben, Käse darüberstreuen und vorsichtig mischen.", "Nach und nach etwas Nudelwasser einrühren, bis die Sauce glänzt. Mit Petersilie servieren."]),
  R("pizza", 53014, "Pizza Margherita selbst gemacht", "Knuspriger Hefeteig mit Paradeissauce, Mozzarella und Basilikum. Jeder darf mitbelegen.", 75, ["Vegetarisch", "Familie"],
    ["Mehl (glatt)|450|g", "Germ (frisch)|1|Stk", "Passierte Tomaten|300|ml", "Mozzarella|2|Stk", "Basilikum|1|Topf", "Olivenöl|3|EL", "Zucker|1|TL", "Oregano|1|TL", "Salz", "Pfeffer"],
    ["Germ und Zucker in 300 ml lauwarmem Wasser auflösen und 10 Minuten stehen lassen, bis es schäumt.", "Mehl mit 2 TL Salz mischen, Germwasser und 2 EL Öl dazugeben und 10 Minuten glatt kneten. Zugedeckt 30 Minuten gehen lassen.", "Ofen auf 230 °C vorheizen. Teig halbieren und auf zwei Blechen dünn ausziehen.", "Passierte Tomaten mit Salz und Oregano würzen und bis zum Rand verstreichen. Mozzarella darauf verteilen, mit Öl beträufeln.", "10 bis 12 Minuten backen und mit frischem Basilikum servieren."]),
  R("stroganoff", 52834, "Rindsgeschnetzeltes Stroganoff", "Zarte Rindfleischstreifen mit Champignons in cremiger Senfsauce. Dazu Bandnudeln oder Reis.", 40, ["Rind"],
    ["Rinderhüfte|500|g", "Champignons|250|g", "Zwiebel|1|Stk", "Knoblauch|1|Zehe", "Crème fraîche|150|g", "Rindsuppe|100|ml", "Bandnudeln|400|g", "Butter|20|g", "Petersilie|1|Bund", "Mehl|1|EL", "Senf|1|EL", "Olivenöl|1|EL", "Salz", "Pfeffer"],
    ["Zwiebel in Streifen schneiden und in Öl 15 Minuten weich dünsten. Knoblauch und Butter dazu, dann die geschnittenen Champignons 5 Minuten mitbraten. Herausnehmen.", "Fleisch in feine Streifen schneiden und in Mehl, Salz und Pfeffer wenden.", "In der heißen Pfanne 3 bis 4 Minuten scharf anbraten.", "Zwiebel-Champignon-Mischung zurück in die Pfanne geben. Crème fraîche, Senf und Suppe verrühren, dazugießen und 5 Minuten köcheln.", "Bandnudeln kochen und mit dem Geschnetzelten und Petersilie servieren."]),
  R("katsucurry", 52820, "Knuspriges Hühnerschnitzel mit Curry-Sauce", "Japanischer Liebling: paniertes Huhn mit milder, leicht süßer Currysauce und Reis.", 50, ["Huhn"],
    ["Hühnerbrust|4|Stk", "Semmelbrösel|100|g", "Eier|1|Stk", "Mehl|4|EL", "Zwiebel|2|Stk", "Karotten|2|Stk", "Knoblauch|3|Zehe", "Currypulver|4|TL", "Hühnersuppe|600|ml", "Honig|2|TL", "Sojasauce|4|TL", "Basmatireis|300|g", "Sonnenblumenöl|200|ml", "Lorbeerblätter|1|Stk", "Salz", "Pfeffer"],
    ["Zwiebeln, Knoblauch und Karotten schneiden und in 2 EL Öl weich dünsten (etwa 10 Minuten).", "2 EL Mehl und Currypulver einrühren, nach und nach die Suppe dazugießen. Honig, Sojasauce und Lorbeer dazu und 20 Minuten köcheln. Sauce pürieren.", "Reis nach Packung kochen.", "Hühnerbrüste flach klopfen, salzen und pfeffern. In Mehl, verquirltem Ei und Bröseln wenden.", "In heißem Öl pro Seite 3 bis 4 Minuten goldbraun braten. In Streifen schneiden und mit Reis und Currysauce servieren."]),
  R("gebratenerreis", 53367, "Gebratener Reis mit Huhn und Gemüse", "Bunter Pfannenreis mit Ei, Erbsen und Karotten. Perfekt, um Reis vom Vortag zu verwerten.", 30, ["Huhn", "Schnell"],
    ["Basmatireis|300|g", "Hühnerbrust|450|g", "Eier|3|Stk", "Zwiebel|1|Stk", "Knoblauch|2|Zehe", "Karotten|1|Stk", "Erbsen (TK)|150|g", "Frühlingszwiebeln|1|Bund", "Ingwer|1|Stk", "Sojasauce|3|EL", "Sesamöl|1|TL", "Sonnenblumenöl|3|EL", "Salz"],
    ["Reis am besten schon am Vortag kochen und abkühlen lassen.", "Huhn klein würfeln und salzen. Eier in etwas Öl im Wok zu Rührei braten und herausnehmen.", "Huhn im restlichen Öl 4 Minuten braten. Zwiebel, Knoblauch, Ingwer und gewürfelte Karotte dazu und 3 Minuten mitbraten.", "Reis und Erbsen dazugeben und unter Rühren 4 Minuten braten.", "Rührei, Sojasauce, Sesamöl und Frühlingszwiebeln untermischen und servieren."]),
  R("suesssauer", 53376, "Huhn süß-sauer mit Ananas", "Knackiges Huhn mit Paprika und Ananas in fruchtiger Sauce. Schmeckt wie beim Lieblings-Chinesen.", 35, ["Huhn"],
    ["Hühnerkeulen ohne Knochen|500|g", "Ananas (Dose)|1|Dose", "Paprika rot|1|Stk", "Paprika gelb|1|Stk", "Eier|1|Stk", "Maisstärke|2|TL", "Ketchup|4|EL", "Essig|4|EL", "Brauner Zucker|3|EL", "Ingwer|1|Stk", "Basmatireis|300|g", "Sonnenblumenöl|2|EL", "Salz"],
    ["Huhn in Stücke schneiden und mit Eiklar, Salz und Maisstärke mischen. 15 Minuten ziehen lassen. Reis kochen.", "Für die Sauce 4 EL Ananassaft, Essig, Ketchup, braunen Zucker und eine Prise Salz verrühren.", "Huhn im sehr heißen Öl auf beiden Seiten je 1 Minute anbraten und herausnehmen.", "Paprika und geriebenen Ingwer 2 Minuten braten, Sauce und Ananasstücke dazugeben und aufkochen.", "Huhn zurückgeben und 2 bis 3 Minuten köcheln, bis es durch ist. Mit Reis servieren."]),
  R("enchiladas", 52765, "Hühner-Enchilada-Auflauf", "Tortillas, zartes Huhn, würzige Sauce und viel geschmolzener Käse. Wie Lasagne auf Mexikanisch.", 50, ["Huhn", "Ofen"],
    ["Hühnerbrust|2|Stk", "Enchilada-Sauce|1|Glas", "Mais-Tortillas|6|Stk", "Cheddar gerieben|300|g", "Sauerrahm|125|g"],
    ["Hühnerbrüste dritteln und in einem Topf mit der Enchilada-Sauce zugedeckt 20 Minuten garen, öfter umrühren.", "Huhn herausnehmen und mit zwei Gabeln zerzupfen. Ofen auf 190 °C vorheizen.", "Etwas Sauce in eine Auflaufform geben, 2 Tortillas darauflegen, dann ein Drittel Huhn, Sauce und Käse.", "Zweimal wiederholen und mit Käse abschließen.", "20 Minuten backen, bis der Käse goldbraun blubbert. Mit Sauerrahm servieren."]),
  R("burger", 53099, "Burger mit Spiegelei und Roter Rübe", "Saftige Rindfleisch-Burger mit allem, was dazugehört. Jeder baut seinen Burger selbst.", 35, ["Rind", "Familie"],
    ["Rinderfaschiertes|500|g", "Burgerbrötchen|4|Stk", "Eier|4|Stk", "Rote Rüben (gekocht)|200|g", "Rucola|50|g", "Paradeiser|2|Stk", "Zwiebel|1|Stk", "Sauerrahm|125|g", "Schnittlauch|1|Bund", "Ofen-Pommes (TK)|750|g", "Sonnenblumenöl|1|EL", "Salz", "Pfeffer"],
    ["Pommes nach Packung im Ofen backen.", "Faschiertes mit 1 TL Salz und Pfeffer mischen und mit nassen Händen 4 Burger formen.", "Brötchen aufschneiden und kurz anrösten. Rote Rüben, Paradeiser und Zwiebel in Scheiben schneiden, Sauerrahm mit Schnittlauch verrühren.", "Burger in einer heißen Pfanne pro Seite 3 Minuten braten. Daneben 4 Spiegeleier braten.", "Brötchen mit Rucola, Burger, Rote Rübe, Paradeiser, Ei und Schnittlauchrahm belegen."]),
  R("gratin", 52780, "Erdäpfelgratin mit Hühnerbrust", "Cremiges Gratin mit Parmesankruste, dazu gebratenes Huhn mit Speck, Erbsen und Spinat.", 50, ["Huhn", "Ofen"],
    ["Erdäpfel speckig|800|g", "Zwiebel|3|Stk", "Hühnerbrust|4|Stk", "Frühstücksspeck|4|Scheiben", "Crème fraîche|200|g", "Parmesan|40|g", "Erbsen (TK)|200|g", "Blattspinat (frisch)|150|g", "Hühnersuppe|100|ml", "Olivenöl|2|EL", "Salz", "Pfeffer"],
    ["Erdäpfel schälen, in dünne Scheiben schneiden und 6 Minuten in Salzwasser vorkochen.", "Zwiebeln fein schneiden und in einer Auflaufform mit Öl und Suppe im Ofen bei 200 °C weich garen.", "Erdäpfel abgießen, auf die Zwiebeln geben, salzen, pfeffern und mit Crème fraîche bedecken. Parmesan darüberreiben und 15 Minuten goldbraun überbacken.", "Hühnerbrüste salzen und mit dem Speck in einer Pfanne pro Seite 5 bis 6 Minuten braten.", "Erbsen und Spinat kurz in der Pfanne erhitzen und alles zusammen servieren."]),
  R("huehnersuppe", 53020, "Hühnersuppe mit Nudeln", "Goldene Suppe mit zartem Hühnerfleisch, Karotten und Nudeln. Hilft gegen alles.", 120, ["Huhn", "Suppe"],

    ["Hühnerkeulen mit 3 Litern kaltem Wasser aufsetzen, aufkochen und 1½ Stunden leise köcheln. Schaum abschöpfen.", "Zwiebel, Lauch, Sellerie, Lorbeer, Pfefferkörner und 1 EL Salz in der letzten Stunde mitkochen.", "Suppe abseihen. Fleisch von den Knochen lösen und in Stücke zupfen.", "Karotten in Scheiben schneiden und mit dem Fleisch in der Suppe 10 Minuten garen.", "Nudeln separat kochen, in Teller geben, mit Suppe übergießen und mit Petersilie bestreuen."]),
  R("lachs", 52773, "Teriyaki-Lachs mit Reis und Brokkoli", "Glänzend glasierter Lachs mit Sesam. Süß-salzig, schnell gemacht und gesund.", 25, ["Fisch", "Schnell"],

    ["Reis nach Packung kochen. Brokkoli in Röschen teilen und 5 Minuten in Salzwasser garen.", "Sojasauce und Honig zu einer Glasur verrühren.", "Lachs in 4 Stücke schneiden und mit der Hälfte der Glasur mischen.", "In einer Pfanne mit Öl bei mittlerer Hitze auf beiden Seiten braten, bis er durch ist. Restliche Glasur dazugeben und kurz einkochen.", "Mit Sesam bestreuen und mit Reis und Brokkoli servieren."]),

$("pPlus").addEventListener("click", () => { if (state.persons < 12) { state.persons++; savePersons(); } });
document.addEventListener("keydown", e => {
  if (dlg.open || /INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
  if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
  const btn = document.querySelector(e.key === "ArrowRight" ? ".act.yes" : ".act.no");
  if (btn) { e.preventDefault(); btn.click(); }
});

// ================= Start =================
localLoad();
render();
(async () => {
  if (!window.claude || !window.claude.use) return;
  const [shared, s] = await Promise.all([window.claude.use("db"), window.claude.use("sample")]);
  if (s) { sample = s; render(); }
  if (!shared) return;
  db = shared;
  state.rounds = {}; state.custom = {};
  render();
  db.collection("rounds").onSnapshot(snap => {
    const next = {};
    snap.docs.forEach(d => { known.add(d.id); const v = d.data() || {}; next[d.id] = { votes: { ...(v.votes || {}) }, have: { ...(v.have || {}) } }; });
    state.rounds = next; render();
  });
  db.collection("custom").onSnapshot(snap => {
    const next = {};
    snap.docs.forEach(d => {
      const v = d.data() || {};
      const r = cleanRecipe({ ...v, ing: (v.ing || []).map(i => [i.n, i.q, i.u]) });
      if (r) next["c-" + d.id] = { ...r, id: "c-" + d.id, ai: true, at: Number(v.at) || 0 };
    });
    state.custom = next; render();
  });
  db.doc("settings/family").onSnapshot(d => {
    const v = d.data() || {}, p = Number(v.persons);
    let changed = false;
    if (p >= 1 && p <= 12 && p !== state.persons) { state.persons = p; changed = true; }
    if (typeof v.quick === "boolean" && v.quick !== state.quick) { state.quick = v.quick; changed = true; }
    if (changed) render();
  });
})();
</script>
