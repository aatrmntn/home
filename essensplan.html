<title>Mampf-Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: ruhige Küchen-App. Kopf mit Woche + Personen, Wochenübersicht (5 Teller), Umschalter Montag/Mittwoch,
   darunter entweder der Karten-Stapel zum Wischen oder (fertig) Gerichte links + Einkaufsliste nach Regalen rechts. */
:root {
  --bg: #f6f5f1;
  --surface: #ffffff;
  --surface-2: #efede7;
  --ink: #1d2320;
  --muted: #646b66;
  --line: #e2dfd7;
  --accent: #2f7a4d;
  --accent-ink: #ffffff;
  --accent-soft: #e2efe6;
  --no: #b5482f;
  --no-soft: #f6e4de;
  --shadow: 0 1px 2px rgba(29, 35, 32, .06), 0 8px 24px rgba(29, 35, 32, .08);
  --font-display: "Young Serif", Georgia, "Times New Roman", serif;
  --font-ui: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --radius: 18px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #151816; --surface: #1e2320; --surface-2: #272d29; --ink: #ecefe9; --muted: #a2aaa4; --line: #323a35;
  --accent: #6cc191; --accent-ink: #0f1a13; --accent-soft: #23362a; --no: #e98b72; --no-soft: #3a2621;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 28px rgba(0,0,0,.35); color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #151816; --surface: #1e2320; --surface-2: #272d29; --ink: #ecefe9; --muted: #a2aaa4; --line: #323a35;
  --accent: #6cc191; --accent-ink: #0f1a13; --accent-soft: #23362a; --no: #e98b72; --no-soft: #3a2621;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 28px rgba(0,0,0,.35); color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
.wrap { max-width: 1080px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 72px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 400; letter-spacing: -0.01em; text-wrap: balance; margin: 0; }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

/* ---------- Kopf ---------- */
header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px; margin-bottom: 24px; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; color: var(--accent); margin-bottom: 6px; }
.brand svg { width: 22px; height: 22px; }
h1 { font-size: clamp(30px, 5vw, 42px); line-height: 1.1; }
.dates { color: var(--muted); margin: 4px 0 0; }
.persons { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 8px 6px 16px; }
.persons span { color: var(--muted); font-size: 15px; }
.persons b { font-variant-numeric: tabular-nums; min-width: 1.4em; text-align: center; font-size: 18px; }
.persons button { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface-2); cursor: pointer; font-size: 18px; line-height: 1; }
.persons button:hover { border-color: var(--muted); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- Wochenübersicht ---------- */
.week { margin-bottom: 28px; }
.week-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 10px; flex-wrap: wrap; }
.week-head h2 { font-size: 22px; }
.week-head p { margin: 0; color: var(--muted); font-size: 14px; }
.slots { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 720px) { .slots { grid-template-columns: repeat(5, minmax(120px, 1fr)); overflow-x: auto; padding-bottom: 6px; scroll-snap-type: x mandatory; } .slot { scroll-snap-align: start; } }
.slot { background: var(--surface); border-radius: 14px; overflow: hidden; border: 1px solid var(--line); text-align: left; padding: 0; min-width: 0; display: flex; flex-direction: column; }
button.slot { cursor: pointer; }
button.slot:hover { box-shadow: var(--shadow); }
.slot .art { aspect-ratio: 5 / 3; background: var(--surface-2); display: block; }
.slot .art svg { width: 100%; height: 100%; display: block; }
.slot .info { padding: 8px 10px 10px; display: grid; gap: 2px; }
.slot .tag { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.slot .nm { font-size: 14px; font-weight: 600; line-height: 1.25; hyphens: auto; }
.slot.empty { border-style: dashed; background: transparent; }
.slot.empty .art { display: grid; place-items: center; background: transparent; color: var(--muted); font-size: 13px; }
.slot.empty .nm { color: var(--muted); font-weight: 500; }

/* ---------- Umschalter ---------- */
.seg { display: inline-grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); background: var(--surface-2); border-radius: 14px; padding: 4px; gap: 4px; width: 100%; max-width: 560px; margin-bottom: 22px; }
.seg button { border: 0; background: transparent; padding: 10px 12px; border-radius: 10px; cursor: pointer; text-align: left; min-width: 0; }
.seg button[aria-selected="true"] { background: var(--surface); box-shadow: var(--shadow); }
.seg .t1 { display: block; font-weight: 700; font-size: 15px; }
.seg .t2 { display: block; font-size: 13px; color: var(--muted); }
.seg .t2.ok { color: var(--accent); font-weight: 600; }

/* ---------- Wischen ---------- */
.swipe { display: grid; justify-items: center; }
.progress { width: 100%; max-width: 420px; margin-bottom: 14px; }
.progress .row { display: flex; justify-content: space-between; font-size: 14px; color: var(--muted); margin-bottom: 6px; }
.progress .row b { color: var(--ink); }
.bars { display: grid; grid-auto-flow: column; gap: 6px; }
.bars i { height: 6px; border-radius: 3px; background: var(--line); }
.bars i.on { background: var(--accent); }
.stage { position: relative; width: 100%; max-width: 420px; height: 520px; }
.rcard { position: absolute; inset: 0; background: var(--surface); border-radius: 22px; box-shadow: var(--shadow); overflow: hidden; display: flex; flex-direction: column; touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab; transform-origin: 50% 85%; border: 1px solid var(--line); }
.rcard.back1 { transform: translateY(10px) scale(.965); opacity: .9; }
.rcard.back2 { transform: translateY(20px) scale(.93); opacity: .7; }
.rcard.back1, .rcard.back2 { pointer-events: none; }
.rcard .art { aspect-ratio: 5 / 3; flex: none; background: var(--surface-2); }
.rcard .art svg { width: 100%; height: 100%; display: block; }
.rcard .body { padding: 16px 20px 18px; display: flex; flex-direction: column; gap: 8px; flex: 1; min-height: 0; }
.rcard h3 { font-size: 24px; line-height: 1.15; }
.rcard p { margin: 0; color: var(--muted); }
.meta { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: var(--surface-2); color: var(--ink); }
.pill svg { width: 14px; height: 14px; }
.pill.ai { background: var(--accent-soft); color: var(--accent); }
.rcard .foot { margin-top: auto; display: flex; justify-content: space-between; align-items: center; }
.link { border: 0; background: none; padding: 0; color: var(--accent); font-weight: 700; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.ings { font-size: 13px; color: var(--muted); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.stamp { position: absolute; top: 18px; font-weight: 800; font-size: 22px; letter-spacing: .06em; padding: 4px 14px; border-radius: 10px; opacity: 0; pointer-events: none; z-index: 2; }
.stamp.yes { left: 18px; background: var(--accent); color: var(--accent-ink); transform: rotate(-8deg); }
.stamp.no { right: 18px; background: var(--no); color: #fff; transform: rotate(8deg); }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; max-width: 420px; margin-top: 18px; }
.act { display: flex; align-items: center; justify-content: center; gap: 8px; height: 56px; border-radius: 16px; font-weight: 700; font-size: 17px; cursor: pointer; border: 1.5px solid var(--line); background: var(--surface); }
.act svg { width: 22px; height: 22px; }
.act.no { color: var(--no); }
.act.no:hover { background: var(--no-soft); border-color: var(--no); }
.act.yes { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.act.yes:hover { filter: brightness(1.05); }
@media (prefers-reduced-motion: no-preference) { .act { transition: transform .12s; } .act:active { transform: scale(.97); } }
.hint { color: var(--muted); font-size: 14px; text-align: center; margin: 12px 0 0; max-width: 420px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; }
.empty-deck { max-width: 420px; text-align: center; }
.empty-deck h3 { font-size: 22px; margin-bottom: 6px; }
.empty-deck p { color: var(--muted); margin: 0 0 14px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 12px; font-weight: 700; cursor: pointer; border: 1.5px solid var(--line); background: var(--surface); text-decoration: none; color: var(--ink); font-size: 15px; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn[disabled] { opacity: .6; cursor: wait; }
.btn svg { width: 18px; height: 18px; }
.ai-row { margin-top: 18px; text-align: center; max-width: 420px; }
.ai-row .q { color: var(--muted); font-size: 14px; margin-bottom: 6px; }
.ai-status { color: var(--muted); font-size: 14px; margin-top: 8px; min-height: 1.4em; }
.locked { max-width: 520px; }
.locked h3 { font-size: 22px; margin-bottom: 6px; }
.locked p { margin: 0; color: var(--muted); }

/* ---------- Fertig ---------- */
.done { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 24px; align-items: start; }
@media (max-width: 860px) { .done { grid-template-columns: minmax(0, 1fr); } }
.done h2 { font-size: 24px; margin-bottom: 4px; }
.done .lead { color: var(--muted); margin: 0 0 14px; }
.picks { display: grid; gap: 12px; }
.pick { display: grid; grid-template-columns: 120px minmax(0, 1fr); background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.pick .art { background: var(--surface-2); }
.pick .art svg { width: 100%; height: 100%; display: block; }
.pick .txt { padding: 12px 14px; display: grid; gap: 4px; align-content: center; min-width: 0; }
.pick h3 { font-size: 18px; line-height: 1.2; }
.pick .row { display: flex; gap: 14px; flex-wrap: wrap; font-size: 14px; }
.pick .row .link.quiet { color: var(--muted); font-weight: 600; }

.shop-card h2 { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.count { font-family: var(--font-ui); font-size: 14px; color: var(--muted); font-weight: 600; }
.meter { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; margin: 10px 0 16px; }
.meter i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.how { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; background: var(--accent-soft); border-radius: 12px; padding: 12px 14px; font-size: 14px; margin-bottom: 14px; }
.how b { grid-column: 1 / -1; }
.how span.n { font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; }
.tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
.copied { color: var(--accent); font-size: 14px; font-weight: 600; }
.group { margin-top: 18px; }
.group h4 { margin: 0 0 4px; font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.group h4 svg { width: 16px; height: 16px; }
ul.items { list-style: none; margin: 0; padding: 0; }
ul.items li { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto auto; gap: 4px 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
ul.items li:last-child { border-bottom: 0; }
ul.items input { width: 20px; height: 20px; accent-color: var(--accent); margin: 0; cursor: pointer; }
.iname { font-weight: 600; min-width: 0; }
.iname small { display: block; font-weight: 400; color: var(--muted); font-size: 13px; line-height: 1.3; }
.qty { font-variant-numeric: tabular-nums; color: var(--muted); text-align: right; white-space: nowrap; font-size: 15px; }
.gk { font-size: 13px; font-weight: 700; color: var(--accent); text-decoration: none; padding: 6px 10px; border-radius: 8px; border: 1.5px solid var(--accent-soft); white-space: nowrap; }
.gk:hover { background: var(--accent-soft); }
li.got .iname, li.got .qty { color: var(--muted); text-decoration: line-through; }
li.got .gk { opacity: .5; }
details.basics { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 12px; }
details.basics summary { cursor: pointer; font-weight: 600; color: var(--muted); }
.save-note { font-size: 13px; color: var(--muted); margin: 16px 0 0; }

/* ---------- Rezept ---------- */
dialog { border: 0; padding: 0; background: transparent; width: min(760px, calc(100vw - 24px)); max-height: calc(100dvh - 24px); color: var(--ink); }
dialog::backdrop { background: rgba(20, 24, 22, .45); }
.sheet { background: var(--surface); border-radius: 22px; overflow-y: auto; max-height: calc(100dvh - 24px); position: relative; }
.sheet .art { aspect-ratio: 5 / 2; background: var(--surface-2); }
.sheet .art svg { width: 100%; height: 100%; display: block; }
.sheet .content { padding: 20px 22px 24px; }
.sheet h2 { font-size: 28px; line-height: 1.15; margin: 6px 0 8px; }
.sheet .desc { color: var(--muted); margin: 10px 0 0; }
.cols { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); gap: 28px; margin-top: 20px; }
@media (max-width: 640px) { .cols { grid-template-columns: minmax(0, 1fr); gap: 18px; } }
.cols h4 { margin: 0 0 8px; font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
table.ing { width: 100%; border-collapse: collapse; font-size: 15px; }
table.ing td { padding: 6px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
table.ing td.q { text-align: right; color: var(--muted); white-space: nowrap; padding-left: 12px; font-variant-numeric: tabular-nums; }
ol.steps { margin: 0; padding: 0; list-style: none; counter-reset: s; display: grid; gap: 12px; }
ol.steps li { counter-increment: s; display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; }
ol.steps li::before { content: counter(s); width: 26px; height: 26px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-weight: 800; font-size: 13px; display: grid; place-items: center; }
.close { position: absolute; top: 12px; right: 12px; width: 38px; height: 38px; border-radius: 50%; border: 0; background: rgba(255,255,255,.92); color: #1d2320; cursor: pointer; display: grid; place-items: center; box-shadow: 0 2px 8px rgba(0,0,0,.15); z-index: 1; }
.close svg { width: 18px; height: 18px; }
.sheet-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 22px; }
</style>

<div class="wrap" lang="de">
  <header>
    <div>
      <div class="brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/></svg>Mampf-Plan</div>
      <h1 id="weekTitle">Diese Woche</h1>
      <p class="dates" id="dates"></p>
    </div>
    <div class="persons" role="group" aria-label="Anzahl Personen">
      <span>Personen</span>
      <button type="button" id="pMinus" aria-label="Eine Person weniger">−</button>
      <b id="pCount">4</b>
      <button type="button" id="pPlus" aria-label="Eine Person mehr">+</button>
    </div>
  </header>

  <section class="week" aria-labelledby="weekHead">
    <div class="week-head"><h2 id="weekHead">Was es diese Woche gibt</h2><p>Montag 3 Gerichte · Mittwoch 2 Gerichte</p></div>
    <div class="slots" id="slots"></div>
  </section>

  <div class="seg" role="tablist" id="tabs" aria-label="Einkaufsrunde"></div>
  <main id="round"></main>
</div>

<dialog id="recipeDlg" aria-labelledby="dlgTitle"><div class="sheet" id="sheet"></div></dialog>

<script>
// ================= Rezepte (Mengen für 4 Personen) =================
const BASICS = new Set(["Salz", "Pfeffer", "Olivenöl", "Sonnenblumenöl", "Zucker", "Gemüsebrühe", "Oregano", "Currypulver", "Paprikapulver", "Majoran", "Muskatnuss", "Kreuzkümmel", "Zimt", "Kräuter der Provence", "Essig", "Senf", "Ketchup"]);
const R = (id, emoji, name, desc, time, ing, steps) => ({ id, emoji, name, desc, time, ing: ing.map(s => { const [n, q, u] = s.split("|"); return [n, Number(q || 0), u || ""]; }), steps });
const RECIPES = [
  R("bolognese", "🍝", "Spaghetti Bolognese", "Der Klassiker, den alle Kinder lieben. Viel Gemüse ist in der Sauce versteckt.", 40,
    ["Spaghetti|500|g", "Rinderfaschiertes|400|g", "Zwiebel|1|Stk", "Karotten|2|Stk", "Knoblauch|2|Zehe", "Passierte Tomaten|700|ml", "Tomatenmark|2|EL", "Parmesan|60|g", "Olivenöl|2|EL", "Oregano|1|TL", "Salz", "Pfeffer"],
    ["Zwiebel, Karotten und Knoblauch klein schneiden.", "Öl erhitzen, Faschiertes darin krümelig anbraten. Gemüse dazugeben und 5 Minuten mitbraten.", "Tomatenmark kurz mitrösten, passierte Tomaten und Oregano dazu. 20 Minuten leise köcheln lassen, mit Salz und Pfeffer abschmecken.", "Spaghetti in Salzwasser nach Packung kochen.", "Mit Sauce und geriebenem Parmesan servieren."]),
  R("kaiserschmarrn", "🥞", "Kaiserschmarrn mit Apfelmus", "Flaumig, zerrupft und mit Staubzucker. Ein süßes Hauptgericht, das alle glücklich macht.", 30,
    ["Eier|6|Stk", "Milch|400|ml", "Mehl|250|g", "Zucker|2|EL", "Butter|40|g", "Rosinen|50|g", "Staubzucker|2|EL", "Apfelmus|500|g", "Salz"],
    ["Eier trennen. Dotter mit Milch, Mehl, Zucker und einer Prise Salz glatt rühren.", "Eiklar steif schlagen und vorsichtig unterheben.", "Butter in einer großen Pfanne schmelzen, Teig hineingießen, Rosinen darüberstreuen und bei mittlerer Hitze 5 Minuten stocken lassen.", "Wenden (in Vierteln geht's leichter), mit zwei Gabeln in Stücke reißen und 3 Minuten fertig braten.", "Mit Staubzucker bestreuen und mit Apfelmus servieren."]),
  R("kasnocken", "🧀", "Kasnocken mit Röstzwiebeln", "Würzige Käsenockerl aus der Pfanne. Schnell gemacht und richtig gemütlich.", 35,
    ["Mehl|400|g", "Eier|4|Stk", "Milch|150|ml", "Bergkäse|200|g", "Zwiebel|3|Stk", "Butter|40|g", "Schnittlauch|1|Bund", "Salz", "Pfeffer", "Muskatnuss"],
    ["Mehl, Eier, Milch, 1 TL Salz und etwas Muskat zu einem zähen Teig schlagen, bis er Blasen wirft. 10 Minuten rasten lassen.", "Zwiebeln in Ringe schneiden und in der Hälfte der Butter langsam goldbraun rösten.", "Teig mit einem Nockerlhobel in kochendes Salzwasser drücken. Sobald die Nockerl oben schwimmen, abschöpfen.", "Nockerl mit der restlichen Butter in einer Pfanne schwenken, geriebenen Käse unterheben, bis er schmilzt.", "Mit Röstzwiebeln, Pfeffer und Schnittlauch servieren."]),
  R("curry", "🍛", "Mildes Hühner-Curry mit Reis", "Cremig mit Kokosmilch und gar nicht scharf. Die süßen Erbsen mögen Kinder besonders.", 35,
    ["Hühnerbrust|500|g", "Basmatireis|300|g", "Kokosmilch|1|Dose", "Zwiebel|1|Stk", "Erbsen (TK)|200|g", "Karotten|2|Stk", "Currypulver|2|TL", "Sonnenblumenöl|2|EL", "Salz"],
    ["Reis nach Packung kochen.", "Zwiebel würfeln, Karotten in dünne Scheiben schneiden, Huhn in mundgerechte Stücke.", "Huhn im Öl rundum anbraten, Zwiebel und Karotten dazu, Currypulver darüberstäuben und kurz mitrösten.", "Kokosmilch angießen und 10 Minuten köcheln. Erbsen dazu, noch 5 Minuten ziehen lassen, salzen.", "Mit dem Reis servieren."]),
  R("lasagne", "🥬", "Spinat-Lasagne", "Saftig mit Spinat, Ricotta und viel Käse obendrauf. Lässt sich gut am Vortag vorbereiten.", 70,
    ["Lasagneblätter|250|g", "Blattspinat (TK)|600|g", "Ricotta|250|g", "Mozzarella|2|Stk", "Passierte Tomaten|700|ml", "Zwiebel|1|Stk", "Knoblauch|2|Zehe", "Parmesan|50|g", "Olivenöl|2|EL", "Salz", "Pfeffer", "Muskatnuss"],

// ================= Teller-Illustrationen =================
const CLOTH = ["#dfe6dc", "#e8e0d2", "#dde3ea", "#eadcd3", "#e4e0ea", "#e2e8da", "#ece4cf"];
function rng(seed) { let a = 0; for (const ch of seed) a = (a * 31 + ch.charCodeAt(0)) | 0; return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function Painter(seed) {
  const r = rng(seed), out = [];
  const R = (a, b) => a + r() * (b - a);
  const inDisc = (cx, cy, rad) => { const a = r() * Math.PI * 2, d = Math.sqrt(r()) * rad; return [cx + Math.cos(a) * d, cy + Math.sin(a) * d]; };
  const blobPath = (cx, cy, rad, wob = .12, n = 10) => {
    const pts = []; for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2, d = rad * (1 + R(-wob, wob)); pts.push([cx + Math.cos(a) * d, cy + Math.sin(a) * d]); }
    let d = ""; for (let i = 0; i < n; i++) { const p0 = pts[i], p1 = pts[(i + 1) % n]; const m = [(p0[0] + p1[0]) / 2, (p0[1] + p1[1]) / 2]; d += (i ? " Q" : "M" + ((pts[n - 1][0] + p0[0]) / 2).toFixed(1) + " " + ((pts[n - 1][1] + p0[1]) / 2).toFixed(1) + " Q") + p0[0].toFixed(1) + " " + p0[1].toFixed(1) + " " + m[0].toFixed(1) + " " + m[1].toFixed(1); }
    return d + "Z";
  };
  const P = {
    r, R, inDisc, out,
    add: s => out.push(s),
    cloth(c) { out.push(`<rect width="400" height="240" fill="${c}"/><g opacity=".08" stroke="#000">${Array.from({ length: 12 }, (_, i) => `<line x1="0" y1="${i * 20 + 10}" x2="400" y2="${i * 20 + 10}"/>`).join("")}</g>`); },
    plate(cx = 200, cy = 120, rad = 96) { out.push(`<circle cx="${cx}" cy="${cy + 4}" r="${rad}" fill="#000" opacity=".1"/><circle cx="${cx}" cy="${cy}" r="${rad}" fill="#fbfaf7"/><circle cx="${cx}" cy="${cy}" r="${rad * .78}" fill="#f3f1ec"/><circle cx="${cx}" cy="${cy}" r="${rad}" fill="none" stroke="#e4e0d8" stroke-width="1.5"/>`); },
    bowl(cx = 200, cy = 120, rad = 92, inner = "#f3f1ec") { out.push(`<circle cx="${cx}" cy="${cy + 5}" r="${rad}" fill="#000" opacity=".12"/><circle cx="${cx}" cy="${cy}" r="${rad}" fill="#fbfaf7"/><circle cx="${cx}" cy="${cy}" r="${rad * .84}" fill="${inner}"/><circle cx="${cx}" cy="${cy}" r="${rad}" fill="none" stroke="#e4e0d8" stroke-width="1.5"/>`); },
    dish(x, y, w, h, inner) { out.push(`<rect x="${x}" y="${y + 5}" width="${w}" height="${h}" rx="22" fill="#000" opacity=".12"/><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="22" fill="#f6f3ee" stroke="#e2ddd3" stroke-width="1.5"/><rect x="${x + 12}" y="${y + 12}" width="${w - 24}" height="${h - 24}" rx="14" fill="${inner}"/>`); },
    board(x, y, w, h) { out.push(`<rect x="${x}" y="${y + 5}" width="${w}" height="${h}" rx="16" fill="#000" opacity=".12"/><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="16" fill="#c99d6d"/><g stroke="#a87b4f" stroke-width="1.2" opacity=".55" fill="none">${Array.from({ length: 6 }, (_, i) => `<path d="M${x + 14} ${y + 18 + i * (h - 30) / 5} q${w / 3} ${R(-6, 6)} ${w - 28} ${R(-4, 4)}"/>`).join("")}</g>`); },
    disc(cx, cy, rad, fill, op = 1) { out.push(`<circle cx="${cx}" cy="${cy}" r="${rad}" fill="${fill}" opacity="${op}"/>`); },
    blob(cx, cy, rad, fill, wob = .12, op = 1) { out.push(`<path d="${blobPath(cx, cy, rad, wob)}" fill="${fill}" opacity="${op}"/>`); },
    scatter(n, cx, cy, rad, fn) { for (let i = 0; i < n; i++) { const [x, y] = inDisc(cx, cy, rad); fn(x, y, i); } },
    dots(n, cx, cy, rad, size, colors, op = 1) { P.scatter(n, cx, cy, rad, (x, y) => out.push(`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(size * R(.75, 1.15)).toFixed(1)}" fill="${colors[Math.floor(r() * colors.length)]}" opacity="${op}"/>`)); },
    ovals(n, cx, cy, rad, w, h, colors, stroke) { P.scatter(n, cx, cy, rad, (x, y) => out.push(`<ellipse cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="${w}" ry="${h}" transform="rotate(${R(0, 180).toFixed(0)} ${x.toFixed(1)} ${y.toFixed(1)})" fill="${colors[Math.floor(r() * colors.length)]}"${stroke ? ` stroke="${stroke}" stroke-width="1"` : ""}/>`)); },
    chunks(n, cx, cy, rad, size, colors, stroke) { P.scatter(n, cx, cy, rad, (x, y) => { const s = size * R(.8, 1.2); out.push(`<rect x="${(x - s / 2).toFixed(1)}" y="${(y - s / 2).toFixed(1)}" width="${s.toFixed(1)}" height="${(s * R(.8, 1.1)).toFixed(1)}" rx="${(s * .28).toFixed(1)}" transform="rotate(${R(0, 90).toFixed(0)} ${x.toFixed(1)} ${y.toFixed(1)})" fill="${colors[Math.floor(r() * colors.length)]}"${stroke ? ` stroke="${stroke}" stroke-width="1"` : ""}/>`); }); },

  { key: "mo", rid: WEEK.id + "-mo", title: "Montag-Einkauf", target: 3, from: 0 },

const pool = () => RECIPES.concat(Object.values(state.custom));

const roundData = rid => state.rounds[rid] || { votes: {}, have: {} };
const chosenIn = rid => Object.entries(roundData(rid).votes || {}).filter(([, v]) => v === "y").map(([k]) => k).filter(byId);

function deckFor(round) {
  const votes = roundData(round.rid).votes || {};
  const blocked = new Set();
  ROUNDS.forEach(r => { if (r.rid !== round.rid) chosenIn(r.rid).forEach(id => blocked.add(id)); });
  ["-mo", "-mi"].forEach(s => chosenIn(lastWeek + s).forEach(id => blocked.add(id)));
  const rnd = rng(round.rid);
  const builtIn = RECIPES.map(r => [rnd(), r]).sort((a, b) => a[0] - b[0]).map(x => x[1]);
  const fresh = Object.values(state.custom).sort((a, b) => (b.at || 0) - (a.at || 0));
  return fresh.concat(builtIn).filter(r => !votes[r.id] && !blocked.has(r.id));
}

  if (!window.claude || !window.claude.use) return;
  const [shared, s] = await Promise.all([window.claude.use("db"), window.claude.use("sample")]);
  if (s) { sample = s; render(); }
  if (!shared) return;
  db = shared;
  state.rounds = {}; state.custom = {};
  render();
  db.collection("rounds").onSnapshot(snap => {
    const next = {};
    snap.docs.forEach(d => { known.add(d.id); const v = d.data() || {}; next[d.id] = { votes: { ...(v.votes || {}) }, have: { ...(v.have || {}) } }; });
    state.rounds = next; render();
  });
  db.collection("custom").onSnapshot(snap => {
    const next = {};
    snap.docs.forEach(d => {
      const v = d.data() || {};
      const r = cleanRecipe({ ...v, ing: (v.ing || []).map(i => [i.n, i.q, i.u]) });
      if (r) next["c-" + d.id] = { ...r, id: "c-" + d.id, ai: true, at: Number(v.at) || 0 };
    });
    state.custom = next; render();
  });
  db.doc("settings/family").onSnapshot(d => {
    const p = Number((d.data() || {}).persons);
    if (p >= 1 && p <= 12 && p !== state.persons) { state.persons = p; render(); }
  });
})();
</script>
